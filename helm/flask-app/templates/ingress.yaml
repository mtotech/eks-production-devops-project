apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:

  name: flask-ingress

  namespace: production

  annotations:

    alb.ingress.kubernetes.io/scheme: internet-facing

    alb.ingress.kubernetes.io/target-type: ip

spec:

  ingressClassName: alb

  rules:

  - http:

      paths:

      - path: /

        pathType: Prefix

        backend:

          service:

            name: flask-app

            port:

              number: 5000
