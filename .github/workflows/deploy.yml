name: EKS Production Pipeline

on:

  push:

    branches:
      - main

env:

  AWS_REGION: ap-south-1

  CLUSTER_NAME: eks-production

  IMAGE_NAME: flask-eks-app

jobs:

  build-test-scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code

        uses: actions/checkout@v4

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run Unit Tests
        run: |
          pytest tests -v 
      
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://3.110.37.114:9000

      - name: Trivy Filesystem Scan

        uses: aquasecurity/trivy-action@master

        with:

          scan-type: fs

          scan-ref: .

      - name: Docker Login

        uses: docker/login-action@v3

        with:

          username: ${{ secrets.DOCKER_USERNAME }}

          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image

        run: |

          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/flask-eks-app:${{ github.sha }} \
          ./app

      - name: Trivy Image Scan

        uses: aquasecurity/trivy-action@master

        with:

          image-ref: ${{ secrets.DOCKER_USERNAME }}/flask-eks-app:${{ github.sha }}

      - name: Push Docker Image

        run: |

          docker push \
          ${{ secrets.DOCKER_USERNAME }}/flask-eks-app:${{ github.sha }}

  deploy:

    needs: build-test-scan

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code

        uses: actions/checkout@v4

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ap-south-1

      - name: Install kubectl

        uses: azure/setup-kubectl@v4

      - name: Install Helm

        uses: azure/setup-helm@v4

      - name: Configure kubeconfig

        run: |

          aws eks update-kubeconfig \
          --name eks-production \
          --region ap-south-1

      - name: Helm Upgrade

        run: |

          helm upgrade \
          --install flask-app \
          ./helm/flask-app \
          --namespace production \
          --create-namespace \
          --set image.repository=${{ secrets.DOCKER_USERNAME }}/flask-eks-app \
          --set image.tag=${{ github.sha }}

      - name: Verify Deployment

        run: |

          kubectl rollout status \
          deployment/flask-app \
          -n production
