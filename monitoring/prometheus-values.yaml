grafana:

  adminPassword: admin123

  service:
    type: LoadBalancer

  persistence:
    enabled: true
    size: 10Gi

prometheus:

  prometheusSpec:

    retention: 15d

    storageSpec:

      volumeClaimTemplate:

        spec:

          accessModes:
            - ReadWriteOnce

          resources:

            requests:
              storage: 20Gi

alertmanager:

  enabled: true

nodeExporter:

  enabled: true

kubeStateMetrics:

  enabled: true
